<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Récupère la valeur du paramètre "filter" dans l’URL
    const urlParams = new URLSearchParams(window.location.search);
    const filter = urlParams.get("filter");

    if (filter) {
      // Retire l'activation sur tous les filtres
      document.querySelectorAll(".portfolio-filters li").forEach(li => {
        li.classList.remove("filter-active");
      });

      // Sélectionne le filtre correspondant
      const targetFilter = document.querySelector(`.portfolio-filters li[data-filter=".filter-${filter}"]`);
      if (targetFilter) {
        targetFilter.classList.add("filter-active");

        // Déclenche un clic dessus pour que Isotope applique le filtre
        targetFilter.click();
      }
    }
  });
</script>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <script>
                Swal.fire({
                    icon: '{{ category }}',
                    title: '{{ category }}',
                    text: '{{ message }}',
                    confirmButtonText: 'OKAY'
                })
            </script>
        {% endfor %}
    {% endif %}
{% endwith %}
